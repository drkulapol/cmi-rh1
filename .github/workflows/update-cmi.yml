name: Update CMI data

on:
  schedule:
    # วันละ 4 รอบ (เวลาไทย 02:17, 08:17, 14:17, 20:17) เผื่อรอบใดเข้าเว็บ CMI ไม่ได้
    # commit เฉพาะเมื่อตัวเลขเปลี่ยน
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      fy:
        description: "ปีงบประมาณ พ.ศ. (เว้นว่าง = ปีงบปัจจุบัน + ปีก่อนหน้า)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-cmi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Probe cmi.moph.go.th (ลองซ้ำสูงสุด 4 ครั้ง)
        run: |
          for i in 1 2 3 4; do
            if timeout 120 python scripts/fetch_cmi.py --probe; then echo "OK=1" >> $GITHUB_ENV; exit 0; fi
            echo "ครั้งที่ $i เข้าเว็บ CMI ไม่ได้ รอ 2 นาที"; sleep 120
          done
          echo "::warning::รอบนี้เข้าเว็บ cmi.moph.go.th ไม่ได้ ข้ามไป ข้อมูลเดิมยังอยู่"

      - name: Fetch CMI + build data-<ปีงบ>.json (ปีงบปัจจุบันและปีก่อนหน้า)
        if: env.OK == '1'
        env:
          FY_IN: ${{ github.event.inputs.fy }}
        run: |
          CUR=$(( $(TZ=Asia/Bangkok date +%Y) + 543 + ( $(TZ=Asia/Bangkok date +%-m) >= 10 ? 1 : 0 ) ))
          echo "CUR=$CUR" >> $GITHUB_ENV
          if [ -n "$FY_IN" ]; then LIST="$FY_IN"; else LIST="$CUR $((CUR-1))"; fi
          for FY in $LIST; do
            OUT="data-$FY.json"
            # ปีงบปัจจุบัน: แสดงทันทีที่มี รพ. ส่งข้อมูล (ขั้นต่ำ 1 แห่ง) · ปีก่อน ๆ: ต้องได้อย่างน้อย 95 แห่ง
            if [ "$FY" -ge "$CUR" ]; then MIN=1; else MIN=95; fi
            if python scripts/fetch_cmi.py --fy "$FY" --out /tmp/cmi --no-excel --min-ok "$MIN"; then
              BASE=$(ls data-*.json 2>/dev/null | grep -v "^$OUT$" | sort -r | head -1 || true)
              BASE=${BASE:-data.json}
              python scripts/build_data.py "/tmp/cmi/cmi_raw_$FY.json" "$OUT" --base "$BASE"
            else
              echo "::notice::ปีงบ $FY ยังไม่มีข้อมูลเพียงพอบนเว็บ CMI — คงไฟล์เดิมไว้"
            fi
          done

      - name: Update years.json + เวลาตรวจล่าสุดใน meta.json
        if: env.OK == '1'
        run: |
          python - "$CUR" <<'PY'
          import glob, json, re, sys
          from datetime import datetime, timezone, timedelta
          cur = int(sys.argv[1])
          ys = {cur} | {int(m.group(1)) for f in glob.glob('data-*.json') if (m := re.fullmatch(r'data-(\d{4})\.json', f))}
          json.dump({'years': sorted(ys, reverse=True), 'default': cur}, open('years.json', 'w'))
          try:
              m = json.load(open('meta.json', encoding='utf-8'))
          except Exception:
              m = {}
          m['checked'] = datetime.now(timezone(timedelta(hours=7))).isoformat(timespec='seconds')
          json.dump(m, open('meta.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('years.json:', sorted(ys, reverse=True), 'default', cur)
          PY

      - name: Commit if changed
        if: env.OK == '1'
        run: |
          git config user.name  "cmi-bot"
          git config user.email "cmi-bot@users.noreply.github.com"
          git add years.json meta.json $(ls data-*.json 2>/dev/null || true)
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
          else
            git commit -m "update CMI data $(TZ=Asia/Bangkok date +%F)"
            git push
          fi
