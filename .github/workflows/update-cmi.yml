name: Update CMI data

on:
  schedule:
    - cron: "17 19 * * *"   # ทุกวัน 02:17 น. เวลาไทย
  workflow_dispatch:
    inputs:
      fy:
        description: "ปีงบประมาณ พ.ศ. (เว้นว่าง = อัตโนมัติ)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-cmi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Probe cmi.moph.go.th
        run: python scripts/fetch_cmi.py --probe

      - name: Fetch CMI
        env:
          FY_IN: ${{ github.event.inputs.fy }}
        run: |
          CUR=$(( $(TZ=Asia/Bangkok date +%Y) + 543 + ( $(TZ=Asia/Bangkok date +%-m) >= 10 ? 1 : 0 ) ))
          FY=${FY_IN:-$CUR}
          # ปีงบใหม่ช่วงต้น ๆ ข้อมูลยังไม่ครบ -> ถ้าไม่ผ่านเกณฑ์ ให้อัปเดตปีงบก่อนหน้าแทน
          if python scripts/fetch_cmi.py --fy "$FY" --out /tmp/cmi --no-excel; then
            echo "FY=$FY" >> $GITHUB_ENV
          elif [ -z "$FY_IN" ]; then
            PREV=$((FY-1))
            python scripts/fetch_cmi.py --fy "$PREV" --out /tmp/cmi --no-excel
            echo "FY=$PREV" >> $GITHUB_ENV
          else
            exit 1
          fi

      - name: Build data.json
        run: python scripts/build_data.py /tmp/cmi/cmi_raw_${FY}.json data.json

      - name: Commit if changed
        run: |
          git config user.name  "cmi-bot"
          git config user.email "cmi-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
          else
            git commit -m "update CMI data $(TZ=Asia/Bangkok date +%F)"
            git push
          fi
