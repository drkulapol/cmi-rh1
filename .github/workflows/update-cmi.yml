name: Update CMI data

on:
  schedule:
    # วันละ 4 รอบ (เวลาไทย 02:17, 08:17, 14:17, 20:17) เผื่อรอบใดเข้าเว็บ CMI ไม่ได้
    # commit เฉพาะเมื่อตัวเลขเปลี่ยน
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      fy:
        description: "ปีงบประมาณ พ.ศ. (เว้นว่าง = อัตโนมัติ)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-cmi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Probe cmi.moph.go.th (ลองซ้ำสูงสุด 4 ครั้ง)
        run: |
          for i in 1 2 3 4; do
            if timeout 120 python scripts/fetch_cmi.py --probe; then echo "OK=1" >> $GITHUB_ENV; exit 0; fi
            echo "ครั้งที่ $i เข้าเว็บ CMI ไม่ได้ รอ 2 นาที"; sleep 120
          done
          echo "::warning::รอบนี้เข้าเว็บ cmi.moph.go.th ไม่ได้ ข้ามไป ข้อมูลเดิมยังอยู่"

      - name: Fetch CMI
        if: env.OK == '1'
        env:
          FY_IN: ${{ github.event.inputs.fy }}
        run: |
          CUR=$(( $(TZ=Asia/Bangkok date +%Y) + 543 + ( $(TZ=Asia/Bangkok date +%-m) >= 10 ? 1 : 0 ) ))
          FY=${FY_IN:-$CUR}
          # ปีงบใหม่ช่วงต้น ๆ ข้อมูลยังไม่ครบ -> ถ้าไม่ผ่านเกณฑ์ ให้อัปเดตปีงบก่อนหน้าแทน
          if python scripts/fetch_cmi.py --fy "$FY" --out /tmp/cmi --no-excel; then
            echo "FY=$FY" >> $GITHUB_ENV
          elif [ -z "$FY_IN" ]; then
            PREV=$((FY-1))
            python scripts/fetch_cmi.py --fy "$PREV" --out /tmp/cmi --no-excel
            echo "FY=$PREV" >> $GITHUB_ENV
          else
            exit 1
          fi

      - name: Build data.json
        if: env.OK == '1'
        run: python scripts/build_data.py /tmp/cmi/cmi_raw_${FY}.json data.json

      - name: Commit if changed
        if: env.OK == '1'
        run: |
          git config user.name  "cmi-bot"
          git config user.email "cmi-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
          else
            git commit -m "update CMI data $(TZ=Asia/Bangkok date +%F)"
            git push
          fi
